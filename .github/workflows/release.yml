name: Build & Release Distributables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (Debian & Tarball)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libx11-dev \
            libayatana-appindicator3-dev \
            x11-utils \
            xvfb \
            dpkg-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Tests
        run: xvfb-run --auto-servernum flutter test

      - name: Build & Package Linux Artifacts
        run: |
          chmod +x scripts/package_linux.sh scripts/install.sh
          ./scripts/package_linux.sh

      - name: Upload Linux Distributables
        uses: actions/upload-artifact@v4
        with:
          name: linux-distributables
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS Application (.zip)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build macOS Release Bundle
        run: flutter build macos --release

      - name: Package macOS App Bundle
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          cd "build/macos/Build/Products/Release"
          zip -r -y "${GITHUB_WORKSPACE}/dist/task-monitor-macos-${VERSION}.zip" "Task Monitor.app"

      - name: Upload macOS Distributables
        uses: actions/upload-artifact@v4
        with:
          name: macos-distributables
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-distributables
          path: release_artifacts

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-distributables
          path: release_artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
